[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-assist"
version = "0.1.0"
description = "Local alternatives review workflow prototype"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Flask>=3.0",
    "geopandas>=1.0",
    "matplotlib>=3.9",
    "openai>=2.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "pyogrio>=0.10",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
imagery = [
    "planetary-computer>=1.0",
    "pystac-client>=0.8",
    "rasterio>=1.3",
    "requests>=2.31",
]

[project.scripts]
review-assist = "review_assist.cli:main"
review-assist-web = "review_assist.web.app:main"

[tool.setuptools.package-data]
review_assist = ["web/templates/*.html", "web/static/*.css", "web/static/*.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
